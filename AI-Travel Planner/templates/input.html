<!DOCTYPE html>
<html>
<head>

    <title>TripMind - Travel Inputs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inputs.css') }}">
</head>
<body>
    <h1 class="form-title">Let's Craft Your Perfect Trip!</h1>

    <div class="form-container">
        <div class="form-image">
            <img src="{{ url_for('static', filename='images/traveler.png') }}" alt="Travel Planning">
        </div>

        <form class="form-box" method="POST" action="/generate">
            <div class="input-group">
                <label>Where would you like to go ? </label>
                <input type="text" name="destination" required>
            </div>

            <div class="input-group">
                <label>How many days are you planning to travel ? </label>
                <input type="number" name="duration" min="1" required>
            </div>

            <div class="input-group">
                <label>What's your budget ? </label>
                <input type="number" name="budget" min="0" required>
            </div>

            <div class="input-group">
    <label>What interests you the most ?</label>
    <select name="interests" required>
        <option value="">-- Select an Interest --</option>
        <option value="adventure">Adventure</option>
        <option value="entertainment">Entertainment</option>
        <option value="technology">Technology</option>
        <option value="sports">Sports</option>
        <option value="restaurants">Restaurants</option>
        <option value="historical sites">Historical Sites</option>
        <option value="nightlife">Nightlife</option>
        <option value="nature">Nature</option>
        <option value="shopping">Shopping</option>
        <option value="art">Art</option>
        <option value="spiritual">Spiritual</option>
    </select>
</div>

            <div class="input-group">
    <label>Travel Month ?</label>
    <select name="month" required>
        <option value="">-- Select a Month --</option>
        <option value="january">January</option>
        <option value="february">february</option>
        <option value="march">march</option>
        <option value="april">April</option>
        <option value="may">May</option>
        <option value="june">June</option>
        <option value="july">July</option>
        <option value="august">August</option>
        <option value="september">September</option>
        <option value="october">October</option>
        <option value="november">November</option>
        <option value="december">December</option>
    </select>
</div>

            <div class="input-group">
                <label>Any dietary preferences ? </label>
                <select name="dietary" required>
                    <option value="">-- Select Dietary Preference --</option>
                    <option value="any">Any</option>
                    <option value="vegetarian">Vegetarian</option>
                    <option value="non-Vegetarian">Vegan</option>
                    <option value="halal">Halal</option>
                </select>
            </div>

            <div class="input-group">
                <label>What's your travel style ? </label>
                <select name="travel-style" required>
                    <option value="">-- Select Travel Style --</option>
                    <option value="solo">Solo</option>
                    <option value="group">Group</option>
                    <option value="family">Family</option>
                    <option value="couple">Couple</option>
                </select>
            </div>

            <button type="submit">Generate My Travel Plan</button>
        </form>
    </div>

</body>
</html>
